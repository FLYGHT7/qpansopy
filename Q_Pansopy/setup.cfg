[flake8]
max-line-length = 119
exclude =
    .git,
    __pycache__,
    .venv

per-file-ignores =
    # QGIS calculation modules: star imports (from qgis.core import *) are the standard QGIS pattern.
    # Explicit imports alongside star imports generate F401 false positives.
    # Compact operator/bracket spacing is intentional for aviation formula readability.
    # W291/W293 in these files originate from UTF-8 BOM encoding that autopep8 cannot rewrite safely.
    # Unblocked by: TD-001 full module refactor to explicit imports
    #
    # Patterns use a leading '*' (not a fixed 'Q_Pansopy/' prefix) so they match this file
    # regardless of invocation cwd: `flake8 --config=Q_Pansopy/setup.cfg Q_Pansopy` from the repo
    # root reports paths as 'Q_Pansopy/modules/...', while the QGIS Plugin Repository's scanner
    # (which lints the extracted plugin zip with cwd inside it) reports './modules/...'.
    *modules/conv/*.py: F401,F403,F405,E225,E231,E201,E202,E211,E221,E222,E265,E266,E402,E501,W291,W293
    *modules/pbn/*.py: F401,F403,F405,E225,E231,E201,E202,E211,E221,E222,E265,E266,E402,E501,W291,W293
    *modules/departures/*.py: F401,F403,F405,E225,E231,E201,E202,E211,E221,E222,E265,E266,E501,E127,E128,W291,W293
    *modules/utilities/*.py: F401,F403,F405,E225,E231,E201,E202,E211,E221,E222,E265,E266,E402,E501,E127,E128,W291,W293
    *modules/utilities/fix_tolerances/*.py: F401,F403,F405,E225,E231,E201,E202,E211,E221,E222,E265,E266,E402,E501,W291,W293
    *modules/basic_ils.py: F401,F403,F405,E225,E231,E201,E202,E211,E221,E222,E265,E266,E501,W291,W293
    *modules/oas_ils.py: F401,F403,F405,E225,E231,E201,E202,E211,E221,E222,E265,E266,E501,W291,W293
    *modules/vss_loc.py: F401,F403,F405,E225,E231,E201,E202,E211,E221,E222,E265,E266,E501,W291,W293
    *modules/vss_straight.py: F401,F403,F405,E225,E231,E201,E202,E211,E221,E222,E265,E266,E501,W291,W293
    *modules/wind_spiral.py: F401,F403,F405,E225,E231,E201,E202,E211,E221,E222,E265,E266,E501,E127,E128,W291,W293
    # ILS dockwidgets: 2-space indentation + long formula strings are legacy artifacts.
    # Unblocked by: TD-002 dockwidget rewrite
    *dockwidgets/ils/qpansopy_ils_dockwidget.py: E111,E114,E501
    *dockwidgets/ils/qpansopy_oas_ils_dockwidget.py: E111,E114,E501
    # utils.py: late import of simplejson/csv at module bottom avoids circular dependency at load time.
    *utils.py: E402
    # parameters_inspector_dialog.py: embedded HTML/CSS/JS template kept as single-line CSS
    # rules (matching the reference sample from issue #193) for easy visual scanning/diffing.
    *parameters_inspector_dialog.py: E501
