[pytest]
testpaths = unit integration
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --tb=short -q
markers =
    unit: pure-math tests, no QGIS runtime required
    integration: stub-based integration/format tests
    qgis_runtime: tests requiring real QGIS Python bindings
    slow: tests that take more than 1 second
